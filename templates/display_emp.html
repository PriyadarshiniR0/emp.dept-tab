<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>

                <th>Eno</th>

            {% for to in ETO %}

                <td>{{to.Eno}}</td>

                <td>{{to.sal}}</td>

    </center>
